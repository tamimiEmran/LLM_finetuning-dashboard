  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--page); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:15px; line-height:1.55}
  .wrap{max-width:860px; margin:0 auto; padding:26px 22px 90px}
  a{color:var(--s1); text-decoration:none} a:hover{text-decoration:underline}
  h1{font-size:24px; letter-spacing:-.02em; margin:0}
  header.top{display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:14px; border-bottom:1px solid var(--grid); padding-bottom:16px}
  .subtitle{color:var(--ink-2); font-size:13.5px; margin:8px 0 0; max-width:64ch}
  .meta{color:var(--muted); font-size:12px; text-align:right; white-space:nowrap}
  .meta code{font-family:ui-monospace,Menlo,Consolas,monospace}
  .theme-btn{margin-top:8px; cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--ink-2); border-radius:8px; padding:3px 9px; font-size:12px; font-family:inherit}

  /* compute / progress strip */

  .cval{font-size:21px; font-weight:650; letter-spacing:-.01em; font-variant-numeric:tabular-nums}
  .clabel{font-size:11.5px; color:var(--muted); margin-top:3px}
  .cnote{font-size:11px; color:var(--muted); margin:7px 2px 0; max-width:74ch}

  details.taskbox summary::before{content:"▸ "; color:var(--muted)}

  table.jt th.l, table.jt td.l{text-align:left}

  table.jt tr.blockrow td{padding:14px 12px 5px; border-bottom:1px solid var(--baseline)}
  table.jt tr.blockrow td{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-2)}
  table.jt .mname{font-weight:600; color:var(--ink)}
  table.jt td.meth{color:var(--muted); font-size:12px}
  table.jt td.hero{font-weight:650}
  table.jt .rnote{display:block; font-size:11px; color:var(--muted); font-style:italic; margin-top:1px}
  table.jt tr.refrow .mname{font-weight:600}
  table.jt tr.refrow td{color:var(--ink-2)}
  table.jt tr.sup td{opacity:.5}

  /* lift figure */
  .liftplot{--lw:150px; position:relative; padding-top:20px}
  .lift-row{display:grid; grid-template-columns:var(--lw) 1fr; align-items:center; column-gap:12px; margin:15px 0}
  .lift-label{font-size:13px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .lift-track{position:relative; height:20px}
  .lift-line{position:absolute; top:50%; height:3px; transform:translateY(-50%); background:var(--baseline); border-radius:2px}
  .lift-dot{position:absolute; top:50%; width:13px; height:13px; border-radius:50%; transform:translate(-50%,-50%); border:2px solid var(--surface)}

  .lift-refs{position:absolute; left:var(--lw); right:0; top:0; bottom:0; margin-left:12px; pointer-events:none}
  .lift-refline{position:absolute; top:16px; bottom:0; border-left:2px dashed var(--muted)}
  .lift-reflabel{position:absolute; top:0; transform:translateX(-50%); font-size:10.5px; color:var(--muted); white-space:nowrap}

  const bf=c.batch_by_family||{};
  const famTxt=Object.keys(FAM).filter(k=>bf[k]&&bf[k].planned>0)
    .map(k=>FAM[k]+' '+bf[k].done+'/'+bf[k].planned).join(' · ');
  const screenDone = c.remaining_runs===0;

/* ---- lift figure (base → SFT, with reference lines) ---- */

  const ov=el('div',{class:'lift-refs'});
  for(const rf of (item.refs||[])){ const t=P(rf.value);
    ov.append(el('div',{class:'lift-refline',style:{left:t+'%'}}));

  }
  plot.append(ov);
  for(const r of item.rows){
    const a=P(r.base), b=P(r.sft);
    const track=el('div',{class:'lift-track'});
    track.append(el('div',{class:'lift-line',style:{left:Math.min(a,b)+'%',width:Math.abs(b-a)+'%'}}));
    track.append(el('div',{class:'lift-dot base',style:{left:a+'%'},onmousemove:e=>showTip(e,'zero-shot base: <b>'+fmt3(r.base)+'</b>'),onmouseleave:hideTip}));
    track.append(el('div',{class:'lift-dot sft',style:{left:b+'%'},onmousemove:e=>showTip(e,'after SFT: <b>'+fmt3(r.sft)+'</b>'),onmouseleave:hideTip}));

    plot.append(el('div',{class:'lift-row'}, el('div',{class:'lift-label'}, r.model), track));

  fig.append(plot);
  fig.append(el('div',{class:'lift-legend'},
    el('span',{class:'lgi'}, el('span',{class:'d',style:{background:'var(--muted)'}}),'zero-shot base'),
    el('span',{class:'lgi'}, el('span',{class:'d',style:{background:'var(--s1)'}}),'after fine-tuning')));

}

/* ---- severity line chart ---- */
function renderSeverity(item){
  const fig=el('figure',{class:'fig'});

  let minR=1; series.forEach(s=>s.points.forEach(p=>minR=Math.min(minR,p.recall)));

  const W=680,H=300,mL=42,mR=14,mT=14,mB=42;
  const px=i=> mL + (n<=1?0:(i/(n-1))*(W-mL-mR));
  const py=v=> mT + (1-(v-y0)/(y1-y0))*(H-mT-mB);
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,class:'sev-svg',preserveAspectRatio:'xMidYMid meet'});
  const ticks=[y0,(y0+y1)/2,y1];
  ticks.forEach(t=>{ svg.append(svgEl('line',{x1:mL,y1:py(t),x2:W-mR,y2:py(t),class:'sev-grid'}));
    svg.append(svgEl('text',{x:mL-7,y:py(t)+3.5,'text-anchor':'end',class:'sev-ytick'}, t.toFixed(2))); });
  labels.forEach((lb,i)=> svg.append(svgEl('text',{x:px(i),y:H-mB+18,'text-anchor':'middle',class:'sev-xtick'}, lb)));
  svg.append(svgEl('text',{x:mL,y:H-6,'text-anchor':'start',class:'sev-axname'}, 'relative energy reduction  (low → high severity)'));
  series.forEach((s,si)=>{

      c.addEventListener('mouseleave',hideTip); svg.append(c); });
  });
  fig.append(svg);
  const lg=el('div',{class:'sev-legend'});
  series.forEach((s,si)=> lg.append(el('span',{class:'lgi'}, el('span',{class:'sw',style:{background:CATS[si%CATS.length]}}), s.model)));

/* ---- data-size curve (S3): macro-F1 vs labeled examples, log x ---- */
function renderCurve(item){
  const fig=el('figure',{class:'fig'});

  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,class:'sev-svg',preserveAspectRatio:'xMidYMid meet'});
  [0,0.25,0.5,0.75,1].forEach(t=>{ svg.append(svgEl('line',{x1:mL,y1:py(t),x2:W-mR,y2:py(t),class:'sev-grid'}));
    svg.append(svgEl('text',{x:mL-7,y:py(t)+3.5,'text-anchor':'end',class:'sev-ytick'}, t.toFixed(2))); });
  // reference guide-lines (dashed) + right-edge labels
  const refs=(item.refs||[]).slice();

  pts.forEach(p=> svg.append(svgEl('text',{x:px(p.n),y:H-mB+18,'text-anchor':'middle',class:'sev-xtick'}, p.full? p.n+' (full)': String(p.n))));
  svg.append(svgEl('text',{x:mL,y:H-6,'text-anchor':'start',class:'sev-axname'}, 'labeled training days (log scale)'));

  const color=CATS[0];

    const c=svgEl('circle',{cx:px(p.n).toFixed(1),cy:py(p.mean).toFixed(1),r:4.5,style:'fill:'+color});
    c.addEventListener('mousemove',e=>showTip(e,`n=${p.n}${p.full?' (full)':''}<br>mean macro-F1 <b>${fmt3(p.mean)}</b> · ${p.seeds.length} seed(s)`));

  });
  fig.append(svg);
  fig.append(el('figcaption',{class:'cap'}, el('b',{}, item.label+'. '+item.title+'. '), item.caption));

/* ---- sections ---- */
function renderSections(){
  const host=document.getElementById('sections'); host.innerHTML='';
  let n=0;
  for(const s of (D.sections||[])){
    n++;
    const sec=el('section',{class:'jsec'});
    const pending = s.status!=='active';
    // Badge is a plain section number for the team; the internal tracking code is
    // kept only as a hover title for cross-reference.
    sec.append(el('h2',{class:'jhead'}, el('span',{class:'jsid',title:s.id}, String(n)), s.title,
      pending? el('span',{class:'jpend-badge'}, s.status):null));
    if(s.q) sec.append(el('p',{class:'jq'}, s.q));
    if(pending){ sec.append(el('div',{class:'jpend'}, s.pending||'Not yet run.')); host.append(sec); continue; }
    for(const it of s.items){
      if(it.kind==='table') sec.append(renderTable(it));
      else if(it.kind==='kv') sec.append(renderKV(it));
      else if(it.figure==='lift') sec.append(renderLift(it));
      else if(it.figure==='severity') sec.append(renderSeverity(it));
      else if(it.figure==='curve') sec.append(renderCurve(it));
    }
    host.append(sec);
  }
}

    el('p',{}, 'Automatically generated from the latest committed results. ',el('a',{href:'data.json'},'Raw numbers'),'.'),
    el('p',{}, 'Every fine-tuned model is scored on the same fixed set of held-out consumers never seen during training, so the numbers are directly comparable. The Gemini and CatBoost reference figures are shown as context bands, not head-to-head comparisons.'),
    el('p',{}, 'Private link — summary results only; no raw data, model weights or per-customer predictions are shared, and the page is not search-indexed.'));
}
(function(){ const btn=el('button',{class:'theme-btn',onclick:()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark?'light':'dark'); render();
}}, '◐ theme'); document.getElementById('meta').after(btn); })();

function render(){ renderCompute(); renderTask(); renderSections(); renderMeta(); }
if(!D){ document.getElementById('sections').innerHTML='<p>No data.</p>'; } else { render(); }
})();
</script>
